# WHY themes live here (not only in CSS): Streamlit's own widgets (inputs, sliders,
# tables, buttons) read these values. Defining BOTH [theme.light] and [theme.dark]
# makes every native control correct in either mode, and Streamlit follows the
# viewer's system setting until they use the in-app toggle.
#
# Palette: cool stone neutrals with two meaning colours. Rani pink marks actions,
# selection and "you"; marigold marks fit scores and progress (CSS only). One
# type family, Schibsted Grotesk, for everything; hierarchy comes from weight
# and size. Values mirror ui/theme.py TOKENS.

[theme]
font = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
headingFont = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
headingFontWeights = 800
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true

[theme.light]
font = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
headingFont = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
headingFontWeights = 800
primaryColor = "#A8224F"
backgroundColor = "#F4F4F1"
secondaryBackgroundColor = "#EEEFEB"
textColor = "#1B1C1F"
linkColor = "#A8224F"
borderColor = "#DCDDD8"
dataframeBorderColor = "#DCDDD8"
dataframeHeaderBackgroundColor = "#EEEFEB"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
chartCategoricalColors = ["#2a78d6", "#169c6c", "#8f5ad6", "#a66b05", "#0089b0", "#6e7f19"]

[theme.dark]
font = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
headingFont = "'Schibsted Grotesk':https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
headingFontWeights = 800
primaryColor = "#E5517F"
backgroundColor = "#141517"
secondaryBackgroundColor = "#25262A"
textColor = "#ECECE8"
linkColor = "#E5517F"
borderColor = "#34363B"
dataframeBorderColor = "#34363B"
dataframeHeaderBackgroundColor = "#1C1D20"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
chartCategoricalColors = ["#3987e5", "#199e70", "#9a6be0", "#b07a10", "#0f95bd", "#7d8c1f"]

[client]
toolbarMode = "minimal"
showErrorDetails = true
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
runOnSave = false
